<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<title>CASCADE 프로토타입 — 막대·중력·흐름</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  /* ── 색 규칙 ───────────────────────────────────────────────────────────
     구조는 죽은 물질이다 — 아주 옅게만 물든 무채색, 반투명.
     흐르는 것만 색을 가진다 — 네온.
     따라서 "색이 진하다 = 이 조직이 살아 있다" 가 화면에서 그대로 성립한다. */
  :root[data-theme="dark"]{
    --bg:#07080b; --panel:rgba(11,13,19,.74); --line:rgba(232,236,242,.10);
    --txt:#e8ecf2; --dim:#79839a; --pure:#fff;
    --neon-up:#4dffd5; --neon-dn:#ff4dcb;
  }
  :root[data-theme="light"]{
    --bg:#eef1f6; --panel:rgba(255,255,255,.8); --line:rgba(20,26,38,.13);
    --txt:#161d2b; --dim:#69738c; --pure:#0b1020;
    --neon-up:#00a389; --neon-dn:#c4008f;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);color:var(--txt);overflow:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-user-select:none;user-select:none;transition:background .35s,color .35s}
  /* canvas 는 대체 요소다. width/height 를 명시하지 않으면 inset:0 으로도 늘어나지
     않고 드로잉 버퍼 크기(화면의 dpr 배)로 좌상단 기준 렌더된다 — Retina 에서
     장면이 우측 하단으로 밀린다. */
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}

  .panel{background:var(--panel);border:1px solid var(--line);
    backdrop-filter:blur(16px);border-radius:3px;transition:background .35s,border-color .35s}

  #say{position:fixed;left:50%;top:18px;transform:translateX(-50%);
    padding:11px 20px;z-index:6;text-align:center;max-width:62vw}
  #say > b{display:block;font:600 13px/1.35 inherit}
  #say > i{display:block;font-style:normal;font-size:11px;line-height:1.5;color:var(--dim);margin-top:4px}
  #say i b{color:var(--txt);font-weight:600}

  #bottom{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    display:flex;gap:6px;z-index:6;flex-wrap:wrap;justify-content:center;max-width:72vw}
  button{font:500 11px/1 inherit;letter-spacing:.04em;color:var(--dim);
    background:var(--panel);border:1px solid var(--line);
    padding:10px 15px;border-radius:3px;cursor:pointer;transition:.15s}
  button:hover{color:var(--txt);border-color:var(--dim)}
  button.on{color:var(--pure);border-color:var(--pure)}
  button:focus-visible{outline:1px solid var(--pure);outline-offset:2px}

  #zoom{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:5px;z-index:6}
  #zoom button{width:38px;height:38px;padding:0;font-size:15px;line-height:1}

  #hud{position:fixed;right:18px;top:18px;padding:14px 15px;z-index:6;width:196px}
  .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin:0 0 3px}
  .lbl{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
  .val{font:500 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--txt)}
  .bar{height:2px;background:var(--line);overflow:hidden;margin-bottom:13px}
  .bar i{display:block;height:100%;width:0;background:var(--dim);transition:width .2s}
  .sep{height:1px;background:var(--line);margin:2px 0 13px}
  .up .lbl{color:var(--neon-up)} .up i{background:var(--neon-up)}
  .dn .lbl{color:var(--neon-dn)} .dn i{background:var(--neon-dn)}

  .tag{position:fixed;transform:translate(-50%,-50%);z-index:5;pointer-events:none;
    font:600 10.5px/1.35 inherit;text-align:center;white-space:nowrap;
    padding:5px 10px;border-radius:3px;background:var(--panel);
    border:1px solid var(--line);opacity:0;transition:opacity .18s;color:var(--txt)}
  .tag.on{opacity:1}
  .tag small{display:block;font-size:9px;font-weight:400;color:var(--dim);margin-top:2px}
  .tag.call{border-color:var(--pure)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="say" class="panel"><b>—</b><i>—</i></div>

<div id="hud" class="panel">
  <div class="row"><span class="lbl">높이</span><span class="val" id="hgt">0.00</span></div>
  <div class="bar"><i id="hgtBar"></i></div>
  <div class="row"><span class="lbl">흔들림</span><span class="val" id="wob">0.0000</span></div>
  <div class="bar"><i id="wobBar"></i></div>
  <div class="sep"></div>
  <div class="up">
    <div class="row"><span class="lbl">현장 → 정점</span><span class="val" id="fUp">0.00</span></div>
    <div class="bar"><i id="fUpBar"></i></div>
  </div>
  <div class="dn">
    <div class="row"><span class="lbl">정점 → 현장</span><span class="val" id="fDn">0.00</span></div>
    <div class="bar"><i id="fDnBar"></i></div>
  </div>
  <div class="row"><span class="lbl">땅에 닿은 접점</span><span class="val" id="gc">0</span></div>
</div>

<div id="zoom">
  <button id="zIn" aria-label="확대">+</button>
  <button id="zOut" aria-label="축소">−</button>
  <button id="zFit" style="font-size:9px">맞춤</button>
</div>

<div id="bottom">
  <button id="bReset">다시</button>
  <button id="bDemo">왜 흔들리지?</button>
  <button id="bSpeed">속도 0.5×</button>
  <button id="bTheme">라이트</button>
  <button id="bVR" style="display:none">VR 시작</button>
</div>

<script src="./three.min.js"></script>
<script>
'use strict';
/* ───────────────────────────────────────────────────────────────────────────
   물리는 Verlet + 거리 제약(PBD). 이 해석기는 삼각형도 사면체도 모르고 거리만
   맞춘다. 그런데도 삼각형은 접히고 사면체는 안 접힌다 — 3D 에서 그게 사실이라서.
   "사면체는 강체다" 라는 규칙을 코드로 쓰지 않았는데 게임에 존재한다.

   흐름은 채널 배열이다. 하향을 자금·운영·유통 3개로 늘릴 때 CHANNELS 에 항목만
   추가하면 된다 — 계산도 렌더도 배열을 순회할 뿐이라 구조를 고치지 않는다.

   VR: 모든 오브젝트는 world 그룹 안에 있다. 몰입 세션에서는 이 그룹을 축소해
   눈앞의 탁상 모형으로 만들고, 양손 그립으로 그룹째 옮기고 키운다.
   ─────────────────────────────────────────────────────────────────────── */

var GRAV = -4.4, DAMP = .992, ITER = 14, GROUND = 0;
var REACH = 2.5;                  // 막대 최대 길이. 얇게 올라가면 이것 때문에 막힌다
var STILL = .00035;
var timeScale = .5;
var GOAL_Y = 2.8, GOAL_UP = 1.0;  // 클리어는 높이 + 상향 도달량. 둘 다 있어야 한다

var P = [], S = [];
var mode = 'build';

/* ─────────────────────────────────────────────────── 물리 */
function addPoint(x, y, z, pin) {
  var j = pin ? 0 : .006;         // 완벽한 수직은 불안정 평형이라 안 쓰러진다
  P.push({ x: x, y: y, z: z, px: x + (Math.random() - .5) * j, py: y,
           pz: z + (Math.random() - .5) * j, pin: !!pin, still: 0, locked: false, born: y });
  return P.length - 1;
}
function d3(p, q) {
  var dx = p.x - q.x, dy = p.y - q.y, dz = p.z - q.z;
  return Math.sqrt(dx * dx + dy * dy + dz * dz);
}
function addStick(a, b) {
  if (a === b || a < 0 || b < 0) return false;
  for (var i = 0; i < S.length; i++)
    if ((S[i].a === a && S[i].b === b) || (S[i].a === b && S[i].b === a)) return false;
  S.push({ a: a, b: b, len: d3(P[a], P[b]) });
  return true;
}
function stickCount(i) {
  var n = 0;
  for (var k = 0; k < S.length; k++) if (S[k].a === i || S[k].b === i) n++;
  return n;
}
function speed(p) { return Math.abs(p.x - p.px) + Math.abs(p.y - p.py) + Math.abs(p.z - p.pz); }
function isLocked(i) { return P[i].pin || P[i].locked; }
// "잠김"은 규칙이 아니라 물리에게 묻는다. 임계값 하나면 미세한 떨림에 깜빡이므로 이력을 준다.
function updateLock(i, dt) {
  var p = P[i];
  if (p.pin) return;
  var v = speed(p);
  if (p.locked) { if (v > STILL * 8) { p.locked = false; p.still = 0; } }
  else { p.still = v < STILL ? p.still + dt : 0; if (p.still > .12) p.locked = true; }
}
function step(dt) {
  var i, p;
  for (i = 0; i < P.length; i++) {
    p = P[i]; if (p.pin) continue;
    var vx = (p.x - p.px) * DAMP, vy = (p.y - p.py) * DAMP, vz = (p.z - p.pz) * DAMP;
    p.px = p.x; p.py = p.y; p.pz = p.z;
    p.x += vx; p.y += vy + GRAV * dt * dt; p.z += vz;
  }
  for (var it = 0; it < ITER; it++) {
    for (i = 0; i < S.length; i++) {
      var s = S[i], A = P[s.a], B = P[s.b];
      var dx = B.x - A.x, dy = B.y - A.y, dz = B.z - A.z;
      var d = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1e-6;
      var diff = (d - s.len) / d;
      var mA = A.pin ? 0 : (B.pin ? 1 : .5), mB = B.pin ? 0 : (A.pin ? 1 : .5);
      A.x += dx * diff * mA; A.y += dy * diff * mA; A.z += dz * diff * mA;
      B.x -= dx * diff * mB; B.y -= dy * diff * mB; B.z -= dz * diff * mB;
    }
    for (i = 0; i < P.length; i++) {
      p = P[i];
      if (!p.pin && p.y < GROUND) { p.y = GROUND; p.px += (p.x - p.px) * .5; }
    }
  }
  for (i = 0; i < P.length; i++) updateLock(i, dt);
}
function maxY() { var h = 0; for (var i = 0; i < P.length; i++) if (P[i].y > h) h = P[i].y; return h; }
function avgWobble() {
  var s = 0, n = 0;
  for (var i = 0; i < P.length; i++) if (!P[i].pin) { s += speed(P[i]); n++; }
  return n ? s / n : 0;
}

/* ─────────────────────────────────────── 구조 분석 · 흐름 */
var CHANNELS = [
  { id: 'up',   up: true,  hue: [.40, .52], rate: 0 },   // 청록 ~ 연두
  { id: 'down', up: false, hue: [.80, .95], rate: 0 }    // 자홍 ~ 분홍
];
var flowState = { hop: [], carry: [], groundContacts: 0, apex: -1, up: 0, down: 0, equity: 1 };

function analyze() {
  var n = P.length, i, k;
  var adj = []; for (i = 0; i < n; i++) adj.push([]);
  for (i = 0; i < S.length; i++) {
    if (!isLocked(S[i].a) || !isLocked(S[i].b)) continue;
    adj[S[i].a].push(S[i].b); adj[S[i].b].push(S[i].a);
  }
  var hop = []; for (i = 0; i < n; i++) hop.push(-1);
  var q = [];
  for (i = 0; i < n; i++) if (P[i].pin) { hop[i] = 0; q.push(i); }
  for (var h = 0; h < q.length; h++) {
    var cur = q[h];
    for (k = 0; k < adj[cur].length; k++) {
      var nb = adj[cur][k];
      if (hop[nb] < 0) { hop[nb] = hop[cur] + 1; q.push(nb); }
    }
  }
  var apex = -1, best = .35;
  for (i = 0; i < n; i++)
    if (!P[i].pin && isLocked(i) && hop[i] > 0 && P[i].y > best) { best = P[i].y; apex = i; }

  // 접점 = 정점에서 실제로 도달 가능한 고정점. 박혀만 있고 위와 안 이어지면 안 센다.
  var gcList = [], seen = [];
  for (i = 0; i < n; i++) seen.push(false);
  if (apex >= 0) {
    var q2 = [apex]; seen[apex] = true;
    for (var j = 0; j < q2.length; j++) {
      var c2 = q2[j];
      if (P[c2].pin) gcList.push(c2);
      for (k = 0; k < adj[c2].length; k++)
        if (!seen[adj[c2][k]]) { seen[adj[c2][k]] = true; q2.push(adj[c2][k]); }
    }
  }
  var gc = gcList.length;
  var carry = [];
  for (i = 0; i < S.length; i++)
    carry.push(isLocked(S[i].a) && isLocked(S[i].b) && seen[S[i].a] && seen[S[i].b]);

  // 상향은 중력을 거스른다 — 높을수록 비싸고, 밑이 넓을수록 많이 올라간다.
  var apexH = apex >= 0 ? P[apex].y : 0;
  var up = apex < 0 ? 0 : gc * .62 / (1 + apexH * .5);

  var eq = 1;
  if (gcList.length > 1 && apex >= 0) {
    var mn = 1e9, mx = 0;
    for (i = 0; i < gcList.length; i++) {
      var dd = d3(P[gcList[i]], P[apex]);
      if (dd < mn) mn = dd;
      if (dd > mx) mx = dd;
    }
    eq = mx > 0 ? mn / mx : 1;
  }
  var down = apex < 0 ? 0 : 1.35 * (.45 + .55 * eq);

  flowState = { hop: hop, carry: carry, groundContacts: gc, apex: apex, up: up, down: down, equity: eq };
  CHANNELS[0].rate = up; CHANNELS[1].rate = down;
}

/* ─────────────────────────────────────── 놓을 자리 */
var spots = [];
function triArea(a, b, c) {
  var ux = b.x - a.x, uy = b.y - a.y, uz = b.z - a.z;
  var vx = c.x - a.x, vy = c.y - a.y, vz = c.z - a.z;
  var cx = uy * vz - uz * vy, cy = uz * vx - ux * vz, cz = ux * vy - uy * vx;
  return .5 * Math.sqrt(cx * cx + cy * cy + cz * cz);
}
function supportsFor(pos) {
  var out = [];
  for (var i = 0; i < P.length; i++) {
    if (!isLocked(i)) continue;
    var d = d3(pos, P[i]);
    if (d <= REACH && d > .45) out.push({ i: i, d: d });
  }
  if (out.length < 3) return null;
  out.sort(function (a, b) { return a.d - b.d; });
  var lim = Math.min(out.length, 7);
  for (var a = 0; a < lim - 2; a++)
    for (var b = a + 1; b < lim - 1; b++)
      for (var c = b + 1; c < lim; c++)
        if (triArea(P[out[a].i], P[out[b].i], P[out[c].i]) > .42)
          return [out[a].i, out[b].i, out[c].i];
  return null;
}
function nearestLocked(pos) {
  var best = -1, bd = REACH;
  for (var i = 0; i < P.length; i++) {
    if (!isLocked(i)) continue;
    var d = d3(pos, P[i]);
    if (d < bd && d > .5) { bd = d; best = i; }
  }
  return best;
}
function computeSpots() {
  spots = [];
  var locked = [], i, k;
  for (i = 0; i < P.length; i++) if (isLocked(i)) locked.push(i);
  if (!locked.length) return;
  locked.sort(function (a, b) { return P[b].y - P[a].y; });
  var cand = [];

  // (1) 공중 — 사면체를 닫아 올라간다
  var dirs = [[0, 1.25, 0]];
  for (var a = 0; a < 6; a++) {
    var th = a / 6 * Math.PI * 2;
    dirs.push([Math.cos(th) * 1.05, .95, Math.sin(th) * 1.05]);
  }
  var seeds = locked.slice(0, 7);
  for (var s = 0; s < seeds.length; s++) {
    var sp = P[seeds[s]];
    for (var d = 0; d < dirs.length; d++) {
      var pos = { x: sp.x + dirs[d][0], y: sp.y + dirs[d][1], z: sp.z + dirs[d][2] };
      if (pos.y < .55) continue;
      var bad = false;
      for (k = 0; k < P.length; k++) if (d3(pos, P[k]) < .8) { bad = true; break; }
      if (bad) continue;
      var sup = supportsFor(pos);
      if (!sup) continue;
      cand.push({ x: pos.x, y: pos.y, z: pos.z, base: sup, ground: false, score: pos.y });
    }
  }
  // (2) 바닥 — 새 접점을 심는다. 상향 용량은 접점 수에서 나오므로 이것이 "넓히기" 다.
  for (i = 0; i < P.length; i++) {
    if (!P[i].pin) continue;
    var pp = P[i], rad = Math.sqrt(pp.x * pp.x + pp.z * pp.z) || 1;
    for (var m = -1; m <= 1; m++) {
      var ang = Math.atan2(pp.z, pp.x) + m * .52;
      var gp = { x: Math.cos(ang) * (rad + 1.25), y: 0, z: Math.sin(ang) * (rad + 1.25) };
      var bad2 = false;
      for (k = 0; k < P.length; k++) if (d3(gp, P[k]) < 1.05) { bad2 = true; break; }
      if (bad2) continue;
      var anchor = nearestLocked(gp);
      if (anchor < 0) continue;
      cand.push({ x: gp.x, y: 0, z: gp.z, base: [anchor], ground: true, score: -.5 });
    }
  }
  cand.sort(function (a, b) { return b.score - a.score; });
  var nAir = 0, nGnd = 0;
  for (var c = 0; c < cand.length && spots.length < 5; c++) {
    if (cand[c].ground ? nGnd >= 2 : nAir >= 3) continue;
    var dup = false;
    for (var g = 0; g < spots.length; g++) if (d3(cand[c], spots[g]) < 1.6) { dup = true; break; }
    if (dup) continue;
    spots.push(cand[c]);
    if (cand[c].ground) nGnd++; else nAir++;
  }
}

/* ─────────────────────────────────────── 게임 */
var game = { active: -1, won: false };
function setupBuild() {
  mode = 'build'; P = []; S = [];
  var idx = [];
  for (var k = 0; k < 3; k++) {
    var a = k / 3 * Math.PI * 2 - Math.PI / 2;
    idx.push(addPoint(Math.cos(a) * 1.25, 0, Math.sin(a) * 1.25, true));
  }
  addStick(idx[0], idx[1]); addStick(idx[1], idx[2]); addStick(idx[2], idx[0]);
  game.active = -1; game.won = false;
  analyze(); computeSpots();
  say('밝은 자리를 골라 클릭하라',
      '공중은 <b>올리는 수</b>, 바닥은 <b>넓히는 수</b>다. 공중에 세우면 곧바로 쓰러지기 시작한다');
  setButtons();
}
function supporters() {
  var out = [];
  if (game.active < 0) return out;
  for (var i = 0; i < P.length; i++) {
    if (i === game.active || !isLocked(i)) continue;
    if (d3(P[i], P[game.active]) > REACH) continue;
    var dup = false;
    for (var k = 0; k < S.length; k++)
      if ((S[k].a === i && S[k].b === game.active) || (S[k].b === i && S[k].a === game.active)) dup = true;
    if (!dup) out.push(i);
  }
  return out;
}
function support(from) {
  if (game.active < 0) return;
  if (!addStick(from, game.active)) return;
  if (stickCount(game.active) === 2)
    say('아직 흔들린다', '막대 2개는 <b>경첩</b>이다 — 두 점을 잇는 축을 중심으로 계속 돈다. 하나 더');
}

/* ─────────────────────────────────────── 비교 시연 */
var demo = { left: -1, right: -1, said: false };
function setupDemo() {
  mode = 'demo'; P = []; S = [];
  function tri(ox) {
    var t = [];
    for (var k = 0; k < 3; k++) {
      var a = k / 3 * Math.PI * 2 - Math.PI / 2;
      t.push(addPoint(ox + Math.cos(a), 0, Math.sin(a), true));
    }
    addStick(t[0], t[1]); addStick(t[1], t[2]); addStick(t[2], t[0]);
    return t;
  }
  var L = tri(-2.2), R = tri(2.2);
  demo.left = addPoint(-2.2, 1.45, 0, false);
  addStick(L[0], demo.left); addStick(L[1], demo.left);

    [new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)]);
  var line = new THREE.Line(g, new THREE.LineBasicMaterial({ transparent: true, opacity: .55 }));
  line.scale.z = 4;
  c.add(line);
  c.userData.squeeze = false;
  scene.add(c);
  c.addEventListener('selectstart', function (e) {
    // 컨트롤러 광선을 world 로컬 좌표계로 되돌려 마우스와 같은 처리를 탄다
    _rot.identity().extractRotation(e.target.matrixWorld);
    ray.ray.origin.setFromMatrixPosition(e.target.matrixWorld);
    ray.ray.direction.set(0, 0, -1).applyMatrix4(_rot).normalize();
    toWorldLocal();
    act();
  });
  c.addEventListener('squeezestart', function (e) { e.target.userData.squeeze = true; });
  c.addEventListener('squeezeend', function (e) { e.target.userData.squeeze = false; grab = null; });
});
var _p0 = new THREE.Vector3(), _p1 = new THREE.Vector3(), _mid = new THREE.Vector3();

function updateGrab() {
  // 양손 그립 = 세계를 잡는다. 벌리면 커지고, 나란히 옮기면 따라온다.
  // 데스크톱의 두 손가락 제스처와 같은 모델이다.
  if (!(ctrls[0].userData.squeeze && ctrls[1].userData.squeeze)) { grab = null; return; }
  _p0.setFromMatrixPosition(ctrls[0].matrixWorld);
  _p1.setFromMatrixPosition(ctrls[1].matrixWorld);
  _mid.addVectors(_p0, _p1).multiplyScalar(.5);
  var dist = _p0.distanceTo(_p1);
  if (!grab) { grab = { mid: _mid.clone(), dist: dist, wp: world.position.clone(), ws: world.scale.x }; return; }
  var s = grab.ws * (dist / Math.max(grab.dist, .04));
  world.scale.setScalar(Math.max(.04, Math.min(1.5, s)));
  world.position.copy(grab.wp).add(_mid).sub(grab.mid);
}
function enterVR() {
  xrOn = true;
  // 눈앞의 탁상 모형으로 만든다. 양손 그립으로 언제든 키우거나 옮길 수 있다.
  world.scale.setScalar(.22);
  world.position.set(0, .85, -.75);
  world.rotation.set(0, 0, 0);
  document.getElementById('bVR').textContent = 'VR 종료';
}
function exitVR() {
  xrOn = false; grab = null;
  world.scale.setScalar(1);
  world.position.set(0, 0, 0);
  document.getElementById('bVR').textContent = 'VR 시작';
}
renderer.xr.addEventListener('sessionstart', enterVR);
renderer.xr.addEventListener('sessionend', exitVR);

(function setupVR() {
  var btn = document.getElementById('bVR');
  if (!navigator.xr || !navigator.xr.isSessionSupported) return;
  navigator.xr.isSessionSupported('immersive-vr').then(function (ok) {
    if (!ok) return;
    btn.style.display = '';
    btn.onclick = function () {
      if (xrSession) { xrSession.end(); return; }
      navigator.xr.requestSession('immersive-vr', {
        optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
      }).then(function (s) {
        xrSession = s;
        s.addEventListener('end', function () { xrSession = null; });
        renderer.xr.setReferenceSpaceType('local-floor');
        return renderer.xr.setSession(s);
      }).catch(function (err) {
        say('VR 을 시작하지 못했다', String(err && err.message || err));
      });
    };
  }).catch(function () {});
}());

/* ─────────────────────────────────────── HUD */
var elSay = document.getElementById('say');
function say(t, s) {
  elSay.querySelector('b').textContent = t;
  elSay.querySelector('i').innerHTML = s || '';
}
var tagL = document.createElement('div'); tagL.className = 'tag'; document.body.appendChild(tagL);
var tagR = document.createElement('div'); tagR.className = 'tag'; document.body.appendChild(tagR);
var _proj = new THREE.Vector3();
function placeTag(el, idx, html, cls, dy) {
  if (xrOn || idx < 0 || idx >= P.length) { el.classList.remove('on'); return; }
  _proj.set(P[idx].x, P[idx].y + (dy || .6), P[idx].z).project(camera);
  el.style.left = ((_proj.x * .5 + .5) * innerWidth) + 'px';
  el.style.top = ((-_proj.y * .5 + .5) * innerHeight) + 'px';
  el.className = 'tag on ' + (cls || '');
  el.innerHTML = html;
}
function setButtons() {
  var b = document.getElementById('bDemo');
  b.classList.toggle('on', mode === 'demo');
  b.textContent = mode === 'demo' ? '돌아가기' : '왜 흔들리지?';
  goalRing.visible = (mode === 'build');
  document.getElementById('hud').style.display = mode === 'build' ? '' : 'none';
}
function resetView() { userZoom = 1; pan.x = pan.y = 0; orbit.yaw = .5; orbit.pitch = .2; }
document.getElementById('bReset').onclick = function () {
  resetView(); if (mode === 'demo') setupDemo(); else setupBuild();
};
document.getElementById('bDemo').onclick = function () {
  resetView(); if (mode === 'demo') setupBuild(); else setupDemo();
};
document.getElementById('bSpeed').onclick = function (e) {
  timeScale = timeScale < .8 ? 1 : .5;
  e.target.textContent = '속도 ' + (timeScale === 1 ? '1×' : '0.5×');
};
document.getElementById('bTheme').onclick = function () {
  applyTheme(themeName === 'dark' ? 'light' : 'dark');
};
document.getElementById('zIn').onclick = function () { userZoom = Math.max(.35, userZoom * .8); };
document.getElementById('zOut').onclick = function () { userZoom = Math.min(4, userZoom * 1.25); };
document.getElementById('zFit').onclick = resetView;
function resize() {
  if (xrOn) return;                      // 몰입 중에는 컴포지터가 프레임버퍼를 소유한다
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ─────────────────────────────────────── 루프 */
applyTheme(themeName);
setupBuild();
var last = performance.now(), reanalyze = 0;

renderer.setAnimationLoop(function (now) {
  now = now || performance.now();
  var raw = Math.min((now - last) / 1000, .033); last = now;
  var t = now / 1000;
  for (var k = 0; k < 2; k++) step(raw * timeScale / 2);

  if (mode === 'demo') {
    var lp = P[demo.left];
    placeTag(tagL, demo.left, '막대 2개<small>삼각형 — 경첩</small>');
    placeTag(tagR, demo.right, '막대 3개<small>사면체 — 강체</small>');
    if (lp && lp.y < .5 && !demo.said) {
      demo.said = true;
      say('왼쪽이 무너졌다',
          '막대 2개는 두 점을 잇는 축을 중심으로 <b>접힌다</b>. 오른쪽은 세 점에 이어져 접힐 방향이 아예 없다');
    }
  } else {
    if (game.active >= 0) {
      placeTag(tagL, game.active, '받쳐라<small>막대 ' + stickCount(game.active) + ' / 3</small>', 'call', .55);
      tagR.classList.remove('on');
      var ap = P[game.active];
      if (isLocked(game.active)) {
        game.active = -1;
        analyze(); computeSpots();
        if (maxY() >= GOAL_Y && flowState.up >= GOAL_UP && !game.won) {
          game.won = true;
          say('완성 — 위아래가 통한다', '높이 <b>' + maxY().toFixed(1) +
              '</b> · 상향 <b>' + flowState.up.toFixed(2) + '</b> · 막대 ' + S.length + '개');
        } else if (!spots.length) {
          say('막다른 길', '막대가 닿는 범위에 받칠 점이 없다. <b>바닥부터 넓혔어야 한다</b>');
        } else if (maxY() >= GOAL_Y) {
          say('높이는 닿았는데 정보가 안 올라온다',
              '접점이 <b>' + flowState.groundContacts + '개</b> 뿐이다. 바닥 자리를 눌러 <b>넓혀라</b>');
        } else {
          say('잠겼다 — 흔들림이 멎었다', '이 점이 새 발판이 된다. 다음 자리를 골라라');
        }
      } else if (ap.y < .3) {
        var dead = game.active;
        S = S.filter(function (s) { return s.a !== dead && s.b !== dead; });
        P.splice(dead, 1);
        S.forEach(function (s) { if (s.a > dead) s.a--; if (s.b > dead) s.b--; });
        game.active = -1; analyze(); computeSpots();
        say('무너졌다', '막대 3개가 붙기 전에 바닥에 닿았다. <b>다시 세워보라</b>');
      }
    } else { tagL.classList.remove('on'); tagR.classList.remove('on'); }
    goalRing.position.y = GOAL_Y;
    reanalyze += raw;
    if (reanalyze > .25) { reanalyze = 0; analyze(); }
  }

  syncParticles(raw * timeScale);

  var h = maxY(), w = avgWobble();
  document.getElementById('hgt').textContent = h.toFixed(2);
  document.getElementById('hgtBar').style.width = Math.min(100, h / GOAL_Y * 100) + '%';
  document.getElementById('wob').textContent = w.toFixed(4);
  document.getElementById('wobBar').style.width = Math.min(100, w * 2400) + '%';
  document.getElementById('fUp').textContent = flowState.up.toFixed(2);
  document.getElementById('fUpBar').style.width = Math.min(100, flowState.up / GOAL_UP * 100) + '%';
  document.getElementById('fDn').textContent = flowState.down.toFixed(2);
  document.getElementById('fDnBar').style.width = Math.min(100, flowState.down / 1.4 * 100) + '%';
  document.getElementById('gc').textContent = flowState.groundContacts;

  if (xrOn) updateGrab();
  else { autoFrame(); placeCamera(); }
  syncMeshes(t);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
